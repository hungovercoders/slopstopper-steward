# What this repo's own steward run covers. Schema: steward.yml.example.
orgs:
  - hungovercoders

# Pull requests on these repos only, so each PR can be read before the
# steward is let loose on the rest. Widen by emptying repos.include
# (docs/runbooks/SETUP.md). The steward is an adopter too: its own
# upgrade is the agent review's test, with a workaround to retire.
repos:
  include:
    - hungovercoders/apic
    - hungovercoders/slopstopper-steward
    - hungovercoders/terminal-of-terror

mode: pr

upgrade:
  policy: latest
  # A release has two days to be yanked before the steward moves a pin to it.
  min_age_days: 2

budgets:
  repos_per_run: 5
  prs_per_repo: 2
  agent_usd: 5
  agent_turns: 60

agent:
  enabled: true
  # The CLI's current Sonnet: enough for reading a diff and a skill and making
  # light edits, at a known cost. Each PR and report names the exact model
  # the alias resolved to; pin that id here to hold it still.
  model: sonnet
  # A second, read-only run reads the pending diff after the agent changed
  # the tree; changes it asks for get one correction round, and an
  # unanswered review makes the PR a draft.
  self_review: true

dependabot:
  # Dependabot's open PRs on these repos are orders too: the steward waits
  # for each one's checks and, red, fixes on Dependabot's own branch (one
  # comment on the PR says what it did). Green, it merges a patch or minor
  # bump itself; the major ones are listed and left to a person.
  enabled: true
  updates: [patch, minor]
  merge: true
  budget: 10

merge:
  # Off until the self-review has been read on a few PRs. On, a green
  # upgrade or refresh PR (merge.kinds) is squash-merged by the run that
  # opened it; a triage PR, a draft, or anything the steward did not see
  # green itself is left for a person.
  auto: false

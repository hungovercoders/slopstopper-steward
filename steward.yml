# What this repo's own steward run covers. Schema: steward.yml.example.
orgs:
  - hungovercoders

# plan until a run's report has been read (docs/runbooks/SETUP.md); then
# pr, with repos.include narrowed to one repo for the first real run.
mode: plan

upgrade:
  policy: latest
  min_age_days: 2

budgets:
  repos_per_run: 5
  prs_per_repo: 2
  agent_usd: 5
  agent_turns: 60

agent:
  enabled: true

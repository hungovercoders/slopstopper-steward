# What this repo's own steward run covers. Schema: steward.yml.example.
orgs:
  - hungovercoders

# The first real run: pull requests on one repo only, so its PR can be
# read before the steward is let loose on the rest. Widen by emptying
# repos.include (docs/runbooks/SETUP.md).
repos:
  include:
    - hungovercoders/apic

mode: pr

upgrade:
  policy: latest
  # 0 for the first upgrade, so apic can move to 0.27.0 the day it shipped;
  # set back to 2 afterwards, so a bad release can be yanked before it lands.
  min_age_days: 0

budgets:
  repos_per_run: 5
  prs_per_repo: 2
  agent_usd: 5
  agent_turns: 60

agent:
  enabled: true

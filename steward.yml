# What this repo's own steward run covers. Schema: steward.yml.example.
orgs:
  - hungovercoders

# The first real run: pull requests on one repo only, so its PR can be
# read before the steward is let loose on the rest. Widen by emptying
# repos.include (docs/runbooks/SETUP.md).
repos:
  include:
    - hungovercoders/apic

mode: pr

upgrade:
  policy: latest
  min_age_days: 2

budgets:
  repos_per_run: 5
  prs_per_repo: 2
  agent_usd: 5
  agent_turns: 60

agent:
  enabled: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopstopper-steward"
version = "0.1.0"
description = "The org-wide operator for slopstopper adopters: finds repos with slopstopper installed, moves pins that fell behind and works the issues slopstopper raised, one PR each."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Griffiths" }]
keywords = ["slopstopper", "ci", "quality", "agent", "github", "maintenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]
# No runtime dependencies: GitHub goes through `gh`, PyPI through urllib,
# the agent through the `claude` CLI and slopstopper through its own
# pinned wheel in a throwaway venv. Same no-deps stance as slopstopper-cli.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
steward = "steward.cli:main"

[project.urls]
Source = "https://github.com/hungovercoders/slopstopper-steward"
Issues = "https://github.com/hungovercoders/slopstopper-steward/issues"
Upstream = "https://github.com/hungovercoders/slopstopper"

[tool.hatch.build.targets.wheel]
packages = ["steward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

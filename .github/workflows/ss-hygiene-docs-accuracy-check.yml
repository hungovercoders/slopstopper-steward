name: SlopStopper · Hygiene - Documentation Accuracy Check

# Scans the repo for documentation references that no longer match
# the code or links they describe. Triggers: PR, push to main, weekly
# schedule. Emits a rolling PR comment, opens/updates a main-branch
# tracking issue on findings, and auto-closes the issue when docs are
# clean.
# Docs: docs/hygiene/README.md.

on:
  # Weekly schedule (every Monday at 07:00 UTC)
  schedule:
    - cron: '0 7 * * 1'

  # No paths filter on purpose. `broken_repo_link` depends on files
  # anywhere in the tree, so a PR that deletes a script a page links to
  # must run this check. It is static, so it takes seconds and no network.
  pull_request:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-docs-accuracy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up slopstopper
        # Python, the mise-pinned toolchain (task, node, slopstopper-cli) and,
        # in the slopstopper repo only, the CLI from source. One local
        # composite action; install.sh copies it in next to the workflows.
        uses: ./.github/actions/ss-setup

      - name: Run documentation accuracy check
        id: check
        continue-on-error: true
        run: task ss:hygiene:docs-accuracy

      - name: Emit PR comment
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit hygiene:docs-accuracy --target pr-comment --status ${{ steps.check.outcome == 'success' && 'pass' || 'fail' }} --on-pass=delete

      - name: Emit issue on main (if issues found)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit hygiene:docs-accuracy --target issue

      - name: Close issue on main when clean
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.check.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: slopstopper emit hygiene:docs-accuracy --target issue --on-pass=close

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-accuracy-report
          path: .ss/reports/docs/docs-accuracy-report.md
          retention-days: 30

      - name: Fail job if issues
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Documentation accuracy issues detected. See report."
          exit 1
